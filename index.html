<!DOCTYPE html>
<html lang="he" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="app-version" content="5">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>ניהול תורים – מרפאה</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Heebo:wght@400;500;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="assets/style.css?v=5">
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 24 24'%3E%3Crect width='24' height='24' rx='6' fill='%230d9488'/%3E%3Cpath d='M12 6.5v11M6.5 12h11' stroke='white' stroke-width='2.6' stroke-linecap='round'/%3E%3C/svg%3E">
</head>
<body>
<div class="app">
  <aside class="sidebar" id="sidebar"></aside>
  <div class="scrim"></div>
  <div class="main">
    <header class="header">
      <button class="icon-btn menu-btn" id="menuBtn" type="button" aria-label="תפריט"></button>
      <nav class="crumbs" id="crumbs"></nav>
      <span class="spacer"></span>
      <span class="today" id="today"></span>
    </header>
    <main class="content" id="view"></main>
  </div>
</div>

<dialog id="dlg">
  <form id="dlgForm" novalidate>
    <div class="dlg-head"><span class="tile" id="dlgTile"></span><h3 id="dlgTitle" tabindex="-1" autofocus style="outline:none"></h3></div>
    <div class="dlg-body" id="dlgBody"></div>
    <div class="dlg-foot">
      <button class="btn primary" type="submit" id="dlgSave">שמירה</button>
      <button class="btn ghost" type="button" id="dlgCancel">ביטול</button>
      <span class="form-msg" id="formMsg" role="alert"></span>
      <span class="more-hint" aria-hidden="true">גללו לשדות נוספים ↓</span>
    </div>
  </form>
</dialog>
<div class="toast" id="toast" role="status"></div>

<script src="assets/schema.js?v=5"></script>
<script src="assets/illustrations.js?v=5"></script>
<script src="assets/shell.js?v=5"></script>
<script src="assets/app.js?v=5"></script>
</body>
</html>
